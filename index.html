<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Catatan Tumbuh Kembang</title>
<style>
:root, .paper{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#f1eee7; --text:#1f2a28; --muted:#5d6966; --border:#e3ded4;
  --primary:#2e7d6b; --primary-2:#22604f; --primary-soft:#e2f1eb; --on-primary:#ffffff; --accent:#cf6d45;
  --ok:#2b7a4b; --ok-bg:#e3f2e7; --warn:#8f5c00; --warn-bg:#fbefd4; --bad:#b0362e; --bad-bg:#fbe3df; --info:#2d5b97; --info-bg:#e2ebf7;
  --band-ok:rgba(43,122,75,.13); --band-warn:rgba(214,146,34,.17); --pt:#cf6d45; --grid:#e8e4db;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(30,40,35,.05);
}
:root{color-scheme:light}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131816; --surface:#1b2220; --surface-2:#232b29; --text:#e6ece9; --muted:#9ba7a3; --border:#2e3835;
    --primary:#5cbfa5; --primary-2:#86d4bf; --primary-soft:#1d3832; --on-primary:#0c1b17; --accent:#f0956e;
    --ok:#80d39c; --ok-bg:#1b3325; --warn:#f0c46e; --warn-bg:#3a2e15; --bad:#f29d93; --bad-bg:#3d211f; --info:#98bbee; --info-bg:#1d2b3f;
    --band-ok:rgba(128,211,156,.13); --band-warn:rgba(240,196,110,.14); --pt:#f0956e; --grid:#29322f;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1b2220; --surface-2:#232b29; --text:#e6ece9; --muted:#9ba7a3; --border:#2e3835;
  --primary:#5cbfa5; --primary-2:#86d4bf; --primary-soft:#1d3832; --on-primary:#0c1b17; --accent:#f0956e;
  --ok:#80d39c; --ok-bg:#1b3325; --warn:#f0c46e; --warn-bg:#3a2e15; --bad:#f29d93; --bad-bg:#3d211f; --info:#98bbee; --info-bg:#1d2b3f;
  --band-ok:rgba(128,211,156,.13); --band-warn:rgba(240,196,110,.14); --pt:#f0956e; --grid:#29322f;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;overflow-x:hidden}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:650}
h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.78rem}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:550;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border))}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);min-width:0}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--muted);font-weight:500}
label.f > span{color:var(--text)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:700px){.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card > h3{margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}

/* Layout */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.brand b{display:block;font-size:.98rem}
.navbtn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;font-weight:500;position:relative}
.navbtn:hover{background:var(--surface-2);color:var(--text)}
.navbtn[aria-current=page]{background:var(--primary-soft);color:var(--primary-2);font-weight:650}
.navbtn .dot{position:absolute;top:8px;left:26px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--border)}
.ic{display:inline-flex;flex:none}
main{min-width:0;padding:26px clamp(16px,3vw,40px) 60px;max-width:1200px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{font-size:1.55rem}
@media(max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--border);z-index:30;gap:0}
  .brand,.side-foot{display:none}
  .navbtn{flex:1;flex-direction:column;gap:1px;font-size:10.5px;padding:7px 2px;align-items:center;text-align:center;min-width:0}
  .navbtn .dot{left:calc(50% + 4px);top:5px}
  main{padding:16px 16px 100px}
  .topbar h1{font-size:1.3rem}
}

/* Pills & alerts */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid transparent;cursor:pointer;text-align:left;width:100%;background:none}
.alert.bad{background:var(--bad-bg)} .alert.warn{background:var(--warn-bg)} .alert.info{background:var(--info-bg)}
.alert .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.alert.bad .bar{background:var(--bad)} .alert.warn .bar{background:var(--warn)} .alert.info .bar{background:var(--info)}
.alert b{display:block;font-weight:650}
.alerts{display:flex;flex-direction:column;gap:8px}

/* Dashboard */
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{width:76px;height:76px;border-radius:50%;background:var(--primary-soft);color:var(--primary-2);display:grid;place-items:center;font-size:1.9rem;font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero-main{flex:1;min-width:200px}
.hero-main h2{font-size:1.6rem}
.tile{display:flex;flex-direction:column;gap:6px}
.tile .lbl{font-size:.82rem;color:var(--muted);font-weight:550;text-transform:uppercase;letter-spacing:.04em}
.tile .val{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .val small{font-size:1rem;font-weight:550;color:var(--muted);margin-left:3px}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--primary);border-radius:99px}
.list{display:flex;flex-direction:column}
.list > .li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
.list > .li:last-child{border-bottom:0}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumbs .ph{aspect-ratio:1}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11px}
.chart .axl{fill:var(--muted);font-size:11.5px;font-weight:600}
.chart .band-ok{fill:var(--band-ok)} .chart .band-warn{fill:var(--band-warn)}
.chart .zl{fill:none;stroke:var(--muted);stroke-width:1}
.chart .zl.z0{stroke:var(--ok);stroke-width:1.8}
.chart .zl.z2{stroke-dasharray:5 4;opacity:.8}
.chart .zl.z3{stroke-dasharray:2 4;opacity:.7}
.chart .zlab{fill:var(--muted);font-size:10.5px}
.chart .today{stroke:var(--primary);stroke-dasharray:3 3;stroke-width:1.2}
.chart .todaylab{fill:var(--primary);font-size:10.5px;font-weight:600}
.chart .pline{fill:none;stroke:var(--pt);stroke-width:2.4;stroke-linejoin:round}
.chart .pt{fill:var(--pt);stroke:var(--surface);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;cursor:pointer;font-size:.85rem;color:var(--muted);font-weight:550}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* Table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Milestones */
details.stage{border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}
details.stage + details.stage{margin-top:10px}
details.stage > summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
details.stage > summary::-webkit-details-marker{display:none}
details.stage[open] > summary{border-bottom:1px solid var(--border)}
details.stage.current{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.stage .progress{grid-column:1/-1}
.ms-item{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.ms-item:last-child{border-bottom:0}
.ms-item input{width:19px;height:19px;margin-top:2px;accent-color:var(--primary);flex:none}
.ms-item .txt{flex:1;min-width:0}
.ms-item.done .t{color:var(--muted)}
.cat{font-size:.72rem;font-weight:650;padding:1px 7px;border-radius:6px;margin-right:6px}
.cat.mk{background:#e5effa;color:#2c5a92} .cat.mh{background:#f3e8f8;color:#7a3b93} .cat.bh{background:#fdeedd;color:#9a5410} .cat.so{background:#e3f3ea;color:#2a7046} .cat.kg{background:#f4f1d8;color:#6c6411}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cat{filter:brightness(.8) saturate(1.2)}}

/* Imm */
.imm-group{padding:12px 0;border-bottom:1px solid var(--border)}
.imm-group:last-child{border-bottom:0}
.imm-group h4{font-size:.9rem;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.imm-item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:7px 0}
.imm-item input[type=checkbox]{width:19px;height:19px;accent-color:var(--primary)}
.imm-item .meta{grid-column:2/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.imm-item input[type=date]{width:auto;padding:4px 8px;font-size:.85rem}

/* Gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ph{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:1;border:0;padding:0;cursor:pointer;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:.75rem;text-align:left}
.dropzone{border:2px dashed var(--border);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.dropzone.over{border-color:var(--primary);background:var(--primary-soft)}

/* Timeline & photo links */
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:340px}
.mini-ph{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.mini-ph .ph{width:42px;height:42px;border-radius:8px;flex:none}
.add-ph{width:42px;height:42px;border-radius:8px;border:1.5px dashed var(--border);background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}
.add-ph:hover{border-color:var(--primary);color:var(--primary)}
.tl{display:flex;flex-direction:column;gap:14px;position:relative}
.tl-item{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:16px}
@media(max-width:640px){.tl-item{grid-template-columns:1fr}}
.tl-photos{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;align-content:start}
.tl-photos .ph:first-child:last-child{grid-column:1/-1}
.tl-photos .add-ph{width:100%;height:auto;aspect-ratio:1}
.tl-photos .ph:first-child:last-child + .add-ph,.tl-photos > .add-ph:only-child{grid-column:1/-1;aspect-ratio:2}
.tl-note{white-space:pre-wrap;font-size:.92rem}
.tl-photos .cap{display:none}
.chart-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.file-pick{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px dashed var(--border);border-radius:12px}

/* Gate */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate-card{width:100%;max-width:520px}
.gate-card .brand{padding:0 0 16px}
.secure-note{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--primary-soft);color:var(--primary-2);font-size:.86rem;align-items:flex-start}

/* Dialog / toast */
dialog.modal{border:1px solid var(--border);border-radius:18px;padding:0;background:var(--surface);color:var(--text);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.modal.wide{width:min(900px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,15,13,.5)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 42px)}
.m-head{padding:16px 20px;border-bottom:1px solid var(--border)}
.m-body{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.m-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.m-foot .left{margin-right:auto}
.lb-img{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:550;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media(max-width:860px){.toast{bottom:84px}}

/* Report */
.paper{background:#fff;color:var(--text);border:1px solid var(--border);border-radius:12px;padding:32px;font-size:13.5px;color-scheme:light}
.paper h1{font-size:1.4rem} .paper h2{font-size:1.05rem;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--primary)}
.paper table{font-size:12.5px} .paper th,.paper td{padding:5px 6px}
.paper .kv td:first-child{color:var(--muted);width:38%}
.rp-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid var(--border);padding-bottom:12px}
.rp-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.paper{padding:16px}.rp-charts{grid-template-columns:1fr}}
#print-root{display:none}
@media print{
  #app,#gate,.toast,dialog{display:none!important}
  #print-root{display:block}
  body{background:#fff}
  @page{size:A4;margin:13mm}
  .paper{border:0;padding:0;border-radius:0}
  .paper h2,.pb{break-after:avoid}
  tr,.rp-charts,.avoid{break-inside:avoid}
}
</style>
</head>
<body>
<div id="gate" hidden></div>
<div id="app" hidden>
  <nav class="side" id="nav" aria-label="Menu utama"></nav>
  <main>
    <div class="topbar">
      <div><h1 id="page-title"></h1><p class="muted small" id="page-sub"></p></div>
      <div class="row">
        <button class="btn sm" id="lock-btn" type="button" title="Kunci sekarang"></button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="print-root"></div>
<script type="module">
'use strict';
/* =========================================================
   Catatan Tumbuh Kembang — aplikasi lokal, terenkripsi.
   Semua data disimpan di IndexedDB perangkat ini, dienkripsi
   AES-256-GCM dengan kunci turunan PBKDF2-SHA256 dari kata sandi.
   Tidak ada data yang dikirim ke server mana pun.
   ========================================================= */

// ---------- Utilitas ----------
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v; // hanya untuk markup statis/aman
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : String(c));
  }
  return e;
}
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const DAY = 86400000;
const daysBetween = (a, b) => Math.round((b - a) / DAY);
function addMonths(d, n) {
  const r = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
  r.setDate(Math.min(d.getDate(), last));
  return r;
}
const ageMonths = (dob, date) => daysBetween(dob, date) / 30.4375;
function ageParts(dob, date) {
  let y = date.getFullYear() - dob.getFullYear(), m = date.getMonth() - dob.getMonth(), d = date.getDate() - dob.getDate();
  if (d < 0) { m--; d += new Date(date.getFullYear(), date.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return { y, m, d };
}
function ageText(dob, date, short) {
  if (date < dob) return 'sebelum lahir';
  const { y, m, d } = ageParts(dob, date), p = [];
  if (y) p.push(y + (short ? ' th' : ' tahun'));
  if (m || y) p.push(m + (short ? ' bl' : ' bulan'));
  if (!short || !y) p.push(d + (short ? ' hr' : ' hari'));
  return p.join(' ');
}

const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('tumbuh-kembang-v1', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction('kv', mode), q = fn(t.objectStore('kv'));
      t.oncomplete = () => res(q && q.result);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  set(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); },
  keys() { return this.tx('readonly', s => s.getAllKeys()); },
  putMany(obj, clearFirst) { return this.tx('readwrite', s => { if (clearFirst) s.clear(); for (const [k, v] of Object.entries(obj)) s.put(v, k); }); },
  clear() { return this.tx('readwrite', s => s.clear()); }
};

const te = new TextEncoder(), td = new TextDecoder();
const ITER = 310000;
async function deriveKey(pass, salt, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encBytes(key, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return { iv, ct: new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes)) };
}
async function decBytes(key, rec) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: rec.iv }, key, rec.ct)); }
const decJSON = async (key, rec) => JSON.parse(td.decode(await decBytes(key, rec)));

const BASELINE_URLS = ['data/baseline.json', 'public/data/baseline.json'];

async function fetchBaseline() {

// Jika data awal tidak ikut di proyek (mis. di Google AI Studio), pengguna memilih file baseline.json dari perangkat.
async function readBaselineFile(file) {
  let d; try { d = JSON.parse(await file.text()); } catch (e) { throw new Error('File ini bukan data awal yang valid.'); }
  if (d.app !== 'catatan-tumbuh-kembang' || !d.records?.state) throw new Error('File ini bukan data awal yang valid.');
  return (BASE = d);

  const st = await decJSON(k, recs.state); // gagal = kata sandi salah
  const meta = { v: 1, salt, iter: base.iter, kid: uid() };
  await DB.putMany({ ...recs, meta }, true);
  META = meta;
  return { k, st };
}

function growthChartSVG(kind, range, opt = {}) {
  const sx = S.child.sex, dob = parseISO(S.child.dob), fieldName = KIND[kind].field, unit = KIND[kind].unit;
  const pts = S.measurements.filter(x => x[fieldName] > 0).map(x => ({ m: ageMonths(dob, parseISO(x.date)), v: +x[fieldName], d: x.date })).filter(p => p.m >= 0 && p.m <= 60).sort((a, b) => a.m - b.m);

  const X = m => L + (m - m0) / (m1 - m0) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const curve = z => { const a = []; for (let i = 0; i <= N; i++) { const m = m0 + (m1 - m0) * i / N; a.push([X(m), Y(f(sx, m, z))]); } return a; };
  const P = a => a.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');

  const xs = (m1 - m0) <= 24 ? 3 : 6;
  for (let m = Math.ceil(m0 / xs) * xs; m <= m1; m += xs) s += `<line class="grid" x1="${X(m).toFixed(1)}" x2="${X(m).toFixed(1)}" y1="${T}" y2="${H - B}"/><text class="tick" x="${X(m).toFixed(1)}" y="${H - B + 15}" text-anchor="middle">${m}</text>`;
  s += band(-3, -2, 'band-warn') + band(-2, 2, 'band-ok') + band(2, 3, 'band-warn');
  [[-3, 'z3'], [-2, 'z2'], [0, 'z0'], [2, 'z2'], [3, 'z3']].forEach(([z, c]) => { const a = curve(z); s += `<path class="zl ${c}" d="${P(a)}"/><text class="zlab" x="${W - R + 4}" y="${(a[a.length - 1][1] + 4).toFixed(1)}">${z > 0 ? '+' + z : z === 0 ? '0' : '−' + (-z)}</text>`; });
  if (nowM >= m0 && nowM <= m1 && !opt.noToday) s += `<line class="today" x1="${X(nowM).toFixed(1)}" x2="${X(nowM).toFixed(1)}" y1="${T}" y2="${H - B}"/><text class="todaylab" x="${X(nowM).toFixed(1)}" y="${T - 6}" text-anchor="middle">Hari ini</text>`;
  const vis = pts.filter(p => p.m >= m0 - 0.01 && p.m <= m1 + 0.01);

  vis.forEach(p => { s += `<circle class="pt" cx="${X(p.m).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="5"><title>${fmtDate(p.d)} · ${fmtNum(p.v, 2)} ${unit}</title></circle>`; });
  s += `<text class="axl" x="4" y="13">${unit}</text><text class="axl" x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">Usia (bulan)</text></svg>`;

}

          const type = /\.png$/i.test(path) ? 'image/png' : /\.gif$/i.test(path) ? 'image/gif' : /\.webp$/i.test(path) ? 'image/webp' : 'image/jpeg';
          await storePhoto(new Blob([bytes], { type }), { date: r.date, link: rec ? { type: 'm', id: rec.id } : null, caption: r.place ? 'Kontrol di ' + r.place : 'Kontrol ' + fmtDate(r.date), src });
          np++;
        } catch (e) { /* lewati gambar yang tidak bisa dibaca */ }
      }
    }
  }
  if (cI.checked) immNew.forEach(([id, d]) => { S.imm[id] = { done: true, date: d }; });
  await save(); rerender();
  toast(`Impor selesai: ${nm} kontrol, ${np} foto, ${cI.checked ? immNew.length : 0} imunisasi`);
}

// ---------- Pengaturan ----------
function viewSettings() {
  const c = S.child;
  const nm = h('input', { type: 'text', required: true, value: c.name, maxlength: 60 });
  const dob = h('input', { type: 'date', required: true, value: c.dob, max: toISO(today()) });
  const sex = h('select', {}, h('option', { value: 'L', selected: c.sex === 'L' }, 'Laki-laki'), h('option', { value: 'P', selected: c.sex === 'P' }, 'Perempuan'));
  const cf = h('form', { class: 'stack' }, h('div', { class: 'form-grid' }, field('Nama anak', nm), field('Tanggal lahir', dob), field('Jenis kelamin', sex)),
    h('div', {}, h('button', { class: 'btn primary', type: 'submit' }, 'Simpan data anak')));
  cf.addEventListener('submit', async e => { e.preventDefault(); Object.assign(S.child, { name: nm.value.trim(), dob: dob.value, sex: sex.value }); await save(); toast('Data anak diperbarui'); rerender(); });

  const al = h('select', { style: 'width:auto', onchange: async e => { S.settings.autolock = +e.target.value; await save(); toast('Disimpan'); } },
    [[5, '5 menit'], [10, '10 menit'], [15, '15 menit'], [30, '30 menit'], [0, 'Tidak pernah']].map(([v, l]) => h('option', { value: v, selected: S.settings.autolock === v }, l)));
  const theme = h('select', { style: 'width:auto', onchange: e => { setTheme(e.target.value); } },
    [['auto', 'Ikuti sistem'], ['light', 'Terang'], ['dark', 'Gelap']].map(([v, l]) => h('option', { value: v, selected: (document.documentElement.dataset.theme || 'auto') === v }, l)));

  const o = h('input', { type: 'password', required: true, autocomplete: 'current-password' });
  const n1 = h('input', { type: 'password', required: true, minlength: 8, autocomplete: 'new-password' });
  const n2 = h('input', { type: 'password', required: true, minlength: 8, autocomplete: 'new-password' });
  const pbtn = h('button', { class: 'btn', type: 'submit' }, 'Ganti kata sandi');
  const pf = h('form', { class: 'stack' }, h('div', { class: 'form-grid' }, field('Kata sandi lama', o), field('Kata sandi baru', n1), field('Ulangi baru', n2)), h('div', {}, pbtn));
  pf.addEventListener('submit', async e => {
    e.preventDefault();
    if (n1.value !== n2.value) { toast('Kata sandi baru tidak sama'); return; }
    pbtn.disabled = true; pbtn.textContent = 'Mengenkripsi ulang…';
    try {
      await saveChain;
      const oldK = await deriveKey(o.value, META.salt, META.iter);
      await Vault.load(oldK); // memastikan kata sandi lama benar
      if (MODE.cloud) Vault.subscribe(onRemoteChange); // load() mengosongkan cache; langganan dipasang ulang di bawah
    } catch { toast('Kata sandi lama salah'); pbtn.disabled = false; pbtn.textContent = 'Ganti kata sandi'; return; }
    try {
      const salt = crypto.getRandomValues(new Uint8Array(16)), newK = await deriveKey(n1.value, salt);
      const st = JSON.parse(JSON.stringify(S));
      const photos = await collectPhotos(st, (p, full) => Vault.getPhoto(KEY, p, full));
      
      const meta = { v: 1, salt, iter: ITER, kid: uid() };
      META = meta;
      await Vault.rebuild(newK, meta, st, photos);
      KEY = newK; S = st; thumbURLs.forEach(u => URL.revokeObjectURL(u)); thumbURLs.clear();
      if (MODE.cloud) Vault.subscribe(onRemoteChange);
      toast(MODE.cloud ? 'Kata sandi keluarga diganti. Beri tahu anggota keluarga kata sandi barunya.' : 'Kata sandi diganti. Buat backup baru.'); rerender();
    } catch (e2) { toast('Gagal mengganti kata sandi: ' + (e2.message || e2.code || e2)); pbtn.disabled = false; pbtn.textContent = 'Ganti kata sandi'; }
  });

  return h('div', { class: 'stack' },
    h('section', { class: 'card' }, h('h3', {}, 'Data anak'), cf),
    h('section', { class: 'card' }, h('h3', {}, 'Keamanan & tampilan'),
      h('div', { class: 'list' },
        h('div', { class: 'li' }, h('span', {}, 'Kunci otomatis jika tidak aktif'), al),
        h('div', { class: 'li' }, h('span', {}, 'Tema'), theme),
        h('div', { class: 'li' }, h('span', { class: 'small muted' }, 'Enkripsi'), h('span', { class: 'small' }, `AES-256-GCM · PBKDF2-SHA256 ${META.iter.toLocaleString('id-ID')} iterasi`))),
      h('h4', { style: 'margin:16px 0 4px' }, 'Ganti kata sandi'), h('p', { class: 'tiny muted', style: 'margin:0 0 10px' }, 'Berlaku untuk perangkat ini. Data awal (baseline) tetap memakai kata sandi lama sampai Anda menggantinya dengan backup terbaru.'), pf),
    h('section', { class: 'card' }, h('h3', {}, 'Tentang privasi'),
      h('ul', { class: 'small', style: 'margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px' },
        MODE.cloud ? [
          h('li', {}, 'Brankas keluarga tersimpan online di halaman claude.ai ini dan tersinkron ke semua anggota keluarga yang diundang.'),
          h('li', {}, 'Setiap catatan & foto dienkripsi AES-256 di browser sebelum dikirim. Server — termasuk Claude — hanya melihat sandi acak.'),
          h('li', {}, 'Anggota keluarga butuh dua hal: undangan sebagai Editor di menu Share, dan kata sandi keluarga.'),
          h('li', {}, 'Kata sandi tidak disimpan di mana pun. Jika lupa, data tidak bisa dibuka — rutin unduh backup terenkripsi.')
        ] : [
          h('li', {}, 'Data awal (riwayat Excel & foto) disimpan sebagai file terenkripsi: public/data/baseline.json. Tanpa kata sandi isinya tidak bisa dibaca.'),
          h('li', {}, 'Saat pertama masuk di sebuah perangkat, data awal dibuka lalu disimpan di browser perangkat itu (IndexedDB), tetap terenkripsi.'),
          h('li', {}, 'Catatan baru tersimpan di perangkat tempat Anda mencatat. Untuk memindahkannya: unduh backup, lalu pulihkan di perangkat lain atau jadikan baseline baru.'),
          h('li', {}, 'Kata sandi tidak disimpan di mana pun. Jika lupa, data tidak bisa dibuka — rutin unduh backup terenkripsi.')
        ])),
    MODE.cloud && !MODE.isOwner ? null : h('section', { class: 'card' }, h('h3', { style: 'color:var(--bad)' }, 'Zona berbahaya'),
      h('p', { class: 'small muted', style: 'margin-bottom:10px' }, MODE.cloud ? 'Menghapus seluruh brankas keluarga (data & foto) untuk semua anggota. Tidak bisa dibatalkan kecuali Anda punya backup.' : 'Menghapus data dan foto dari perangkat ini. Saat masuk lagi, aplikasi memuat ulang data awal (baseline); catatan yang belum di-backup akan hilang.'),
      h('button', { class: 'btn danger', type: 'button', onclick: async () => {
        const inp = h('input', { type: 'text', required: true, placeholder: 'HAPUS', pattern: 'HAPUS' });
        const r = await modal('Hapus semua data?', h('div', { class: 'stack', style: 'gap:10px' }, h('p', {}, 'Ketik HAPUS untuk konfirmasi.'), inp), [{ label: 'Batal', value: 'cancel' }, { label: 'Hapus semua', value: 'ok', cls: 'danger' }]);
        if (r !== 'ok' || inp.value !== 'HAPUS') return;
        toast('Menghapus…');
        try { await Vault.wipe(); } catch (e) { toast('Gagal menghapus: ' + (e.message || e.code || e)); return; }
        KEY = null; S = null; META = null; timers.forEach(clearInterval); timers = []; BASE = null; renderLogin('Data perangkat ini dihapus. Masuk lagi untuk memuat data awal.');
      } }, icon('trash', 18), 'Hapus semua data')));
}
function setTheme(v) {
  try { if (v === 'auto') localStorage.removeItem('tk-theme'); else localStorage.setItem('tk-theme', v); } catch (e) {}
  if (v === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
}
try { const th = localStorage.getItem('tk-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

// ---------- Mulai ----------
(async function boot() {
  let idbOk = false; try { idbOk = !!window.indexedDB; } catch (e) {}
  const cryptoOk = !!(window.isSecureContext && window.crypto && window.crypto.subtle);
  if (!idbOk || !cryptoOk) {
    showGate(h('div', { class: 'card gate-card' }, brandEl(''),
      h('div', { class: 'stack', style: 'gap:10px' },
        h('p', {}, h('b', {}, 'Browser ini memblokir enkripsi atau penyimpanan.')),
        h('p', { class: 'small muted' }, !cryptoOk ? 'Web Crypto tidak tersedia — buka lewat https:// atau http://localhost.' : 'Penyimpanan (IndexedDB) diblokir, misalnya di mode penyamaran.'),
        h('p', { class: 'small' }, 'Gunakan Chrome, Edge, Firefox, atau Safari versi terbaru.'))));
    return;
  }
  try { await DB.open(); META = await DB.get('meta'); }
  catch (e) { showGate(h('div', { class: 'card gate-card' }, brandEl(''), h('p', {}, 'Penyimpanan tidak bisa dibuka: ' + e.message))); return; }
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  renderLogin();
})();

</script>
